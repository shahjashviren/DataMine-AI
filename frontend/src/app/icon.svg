<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Main blue-purple-pink gradient matching the "DataMine AI" title -->
    <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="50%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Softer glow fill for nodes -->
    <linearGradient id="g2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="50%"  stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <!-- Dark background radial -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </radialGradient>
  </defs>

  <!-- Background pill -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- ── Pipeline flow: three nodes connected by two tapered conduits ── -->

  <!-- Conduit A: node-left → node-mid (slightly tapered) -->
  <path d="M 8 15.2 L 13.5 14 L 13.5 18 L 8 16.8 Z" fill="url(#g1)" opacity="0.75"/>

  <!-- Conduit B: node-mid → node-right -->
  <path d="M 18.5 14 L 24 12.8 L 24 19.2 L 18.5 18 Z" fill="url(#g1)" opacity="0.75"/>

  <!-- Node left — source -->
  <circle cx="7"  cy="16" r="3.8" fill="url(#g2)" opacity="0.95"/>
  <circle cx="7"  cy="16" r="3.8" fill="none" stroke="url(#g1)" stroke-width="0.8"/>

  <!-- Node mid — transform -->
  <circle cx="16" cy="16" r="4.4" fill="url(#g2)" opacity="0.95"/>
  <circle cx="16" cy="16" r="4.4" fill="none" stroke="url(#g1)" stroke-width="0.9"/>

  <!-- Node right — output (slightly larger, brighter) -->
  <circle cx="25" cy="16" r="3.8" fill="url(#g2)" opacity="0.95"/>
  <circle cx="25" cy="16" r="3.8" fill="none" stroke="url(#g1)" stroke-width="0.8"/>

  <!-- Inner spark dots (data pulses) on each node -->
  <circle cx="7"  cy="16" r="1.3" fill="#ffffff" opacity="0.85"/>
  <circle cx="16" cy="16" r="1.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="25" cy="16" r="1.3" fill="#ffffff" opacity="0.85"/>

  <!-- Tiny directional arrow tip on conduit B exit -->
  <path d="M 23 14.5 L 26.5 16 L 23 17.5" fill="none" stroke="url(#g1)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.0"/>
</svg>
